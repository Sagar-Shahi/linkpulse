<dl class="stats">
  <div class="stat"><dt>Clicks, last {{ days }} days</dt><dd>{{ stats.total }}</dd></div>
  <div class="stat"><dt>Unique visitors</dt><dd>{{ stats.unique_visitors }}</dd><dd class="stat-note">Counted per day. No IP address is stored.</dd></div>
  <div class="stat"><dt>Clicks today</dt><dd>{{ stats.today }}</dd></div>
  <div class="stat"><dt>Bots and previews</dt><dd>{{ stats.bots }}</dd><dd class="stat-note">Left out of every other number.</dd></div>
</dl>
